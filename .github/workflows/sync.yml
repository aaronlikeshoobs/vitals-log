name: Sync Health Data

on:
  schedule:
    # 13:00 UTC = 6am/5am Pacific depending on DST — after overnight sync, before the day starts
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-api-python-client google-auth

      - name: Run sync
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: python scripts/sync_health_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "vitals-log-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet data.json; then
            git add data.json
            git commit -m "Sync health data $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes to data.json"
          fi
