<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">

<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Vitals Log" />

<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap');

  :root{
    --ink:#0D1110;
    --panel:#161C1A;
    --line:#2A332F;
    --text:#EAEFEC;
    --muted:#8CA39A;
    --pulse:#4FD9AE;
    --red:#FF6B6B;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{background:var(--ink); color:var(--text); font-family:'Public Sans',sans-serif; -webkit-font-smoothing:antialiased; touch-action:manipulation; overflow-anchor:none; overflow-x:hidden;}
  body{padding-bottom:70px;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  header{
    padding:32px 20px 24px;
    border-bottom:1px solid var(--line);
    position:relative;
    overflow:hidden;
  }
  header .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--pulse);
    margin-bottom:8px;
  }
  header h1{ font-size:28px; font-weight:700; letter-spacing:-0.01em; }
  header .sub{ color:var(--muted); font-size:13.5px; margin-top:6px; line-height:1.5; }
  .ecg{ position:absolute; bottom:0; left:0; right:0; height:28px; opacity:0.5; }
  .ecg path{
    stroke:var(--pulse); stroke-width:1.5; fill:none;
    stroke-dasharray:400; stroke-dashoffset:400;
    animation:draw 3.5s ease-out forwards;
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }

  .category{ padding:26px 20px 6px; }
  .category-head{ display:flex; align-items:baseline; gap:8px; justify-content:space-between; margin-bottom:12px; }
  .category-head h2{ font-size:13px; text-transform:uppercase; letter-spacing:0.08em; font-weight:600; display:flex; align-items:center; gap:7px; }
  .category-head .count{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .metric-row{ display:flex; align-items:center; gap:14px; padding:16px 16px; border-bottom:1px solid var(--line); min-height:44px; }
  .metric-row:last-child{ border-bottom:none; }
  .metric-row .info{ flex:1; min-width:0; }
  .metric-row .label{ font-size:14px; font-weight:500; }
  .metric-row .date{ font-size:11.5px; color:var(--muted); margin-top:3px; }
  .metric-row .spark{ width:56px; height:24px; flex-shrink:0; }
  .spark-wrap{ display:flex; flex-direction:column; align-items:center; gap:1px; flex-shrink:0; }
  .spark-range{ font-size:8px; color:var(--muted); white-space:nowrap; letter-spacing:0.01em; }
  .metric-row .valwrap{ text-align:right; flex-shrink:0; min-width:74px; }
  .metric-row .val{ font-size:16px; font-weight:600; }
  .metric-row .unit{ font-size:10.5px; color:var(--muted); margin-left:2px; }
  .metric-row .delta{ font-size:10.5px; margin-top:3px; }
  .delta.up{ color:var(--pulse); }
  .delta.down{ color:var(--red); }
  .delta.flat{ color:var(--muted); }
  .loading, .error{ text-align:center; padding:60px 20px; color:var(--muted); font-size:13px; }
  .stale-badge{
    display:inline-block; font-size:9.5px; font-family:'IBM Plex Mono',monospace;
    color:var(--muted); border:1px solid var(--line); border-radius:4px;
    padding:2px 6px; margin-left:6px; vertical-align:middle;
  }
  footer{ text-align:center; padding:28px 20px; color:var(--muted); font-size:11px; }

  .readiness{ margin:20px 20px 0; padding:14px 16px; background:var(--panel); border:1px solid var(--line); border-radius:12px; display:flex; gap:10px; align-items:flex-start; font-size:13px; line-height:1.5; }
  .readiness a{ color:var(--pulse); text-decoration:none; }
  .metric-row{ cursor:pointer; }
  .metric-row .chev{ color:var(--muted); font-size:11px; margin-left:2px; }
  .detail-panel{ padding:14px 16px 18px; border-bottom:1px solid var(--line); background:#111613; }
  .detail-panel:last-child{ border-bottom:none; }
  .detail-empty{ color:var(--muted); font-size:12px; text-align:center; padding:20px 0; }
  .detail-list{ margin-top:8px; display:flex; flex-direction:column; gap:2px; }
  .detail-row{ display:flex; justify-content:space-between; padding:5px 2px; font-size:11.5px; color:var(--muted); border-bottom:1px solid var(--line); }
  .detail-row:last-child{ border-bottom:none; }
  .detail-row span:last-child{ color:var(--text); }

  .workout-list{ padding: 2px 0; }
  .workout-card{ display:flex; align-items:center; gap:12px; padding:13px 16px; border-bottom:1px solid var(--line); }
  .workout-card:last-child{ border-bottom:none; }
  .workout-icon{ font-size:22px; width:34px; text-align:center; flex-shrink:0; }
  .workout-info{ flex:1; min-width:0; }
  .workout-name{ font-size:14px; font-weight:600; }
  .workout-date{ font-size:11px; color:var(--muted); margin-top:2px; }
  .workout-stats{ font-size:11px; color:var(--text); margin-top:4px; opacity:0.85; }
  .chart-legend{ display:flex; align-items:center; gap:6px; font-size:10.5px; color:var(--muted); margin-top:2px; font-family:'IBM Plex Mono',monospace; }
  .legend-tick{ width:2px; height:10px; background:#F2C94C; border-radius:1px; display:inline-block; }
</style>
</head>
<body>
<style>.hub-nav{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;min-height:44px;background:#0D1110;border-bottom:1px solid #2A332F;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;position:sticky;top:0;z-index:50}.hub-nav a{color:#4FD9AE;text-decoration:none;display:flex;align-items:center;gap:4px;padding:6px 8px;margin:-6px -8px;font-weight:600}.hub-nav .hub-nav-title{color:#8CA39A;font-size:11px}</style>
<div class="hub-nav"><a href="https://aaronlikeshoobs.github.io/fitness-hub/" target="_top">&larr; Hub</a><span class="hub-nav-title">Vitals Log</span></div>

<header>
  <div class="eyebrow">🫀 Started 25 Jul 2026 · Auto-synced daily</div>
  <h1>Vitals Log</h1>
  <div class="sub">Body composition, daily activity &amp; cycling output — tracked over time</div>
  <svg class="ecg" viewBox="0 0 400 28" preserveAspectRatio="none">
    <path d="M0,14 L60,14 L72,14 L80,2 L88,26 L96,14 L120,14 L400,14"/>
  </svg>
</header>

<div id="app"><div class="loading">Loading…</div></div>
<footer>🔄 Synced from Apple Health via Health Auto Export → Google Drive → GitHub Actions</footer>

<script>
const CATEGORY_ICONS = {
  'Body Composition': '⚖️',
  'Daily Activity': '👣',
  'Point-in-Time': '🎯',
};

// dir: which direction counts as improvement for THIS person's goals — 'up-good' | 'down-good' | 'neutral'.
// compareMode: 'rolling7' averages a 7-day window vs the prior 7-day window (smooths day-to-day noise).
//   'latestVsPrevious' is used for sparse/periodic metrics (VO2 max tests, rides) where windows don't make sense.
// cumulative: true for metrics that accumulate over a day (steps, distance...) — today's reading gets a "partial" label.
// roundInt: true for count-based metrics where a fractional value (e.g. 9431.63 steps) is a display artifact, not a real reading.
const METRICS = [
  {id:'weight', label:'Weight', unit:'lb', cat:'Body Composition', dir:'neutral', compareMode:'rolling7'},
  {id:'bmi', label:'BMI', unit:'', cat:'Body Composition', dir:'neutral', compareMode:'rolling7'},
  {id:'fat_mass', label:'Fat Mass', unit:'%', cat:'Body Composition', dir:'down-good', compareMode:'rolling7'},
  {id:'lean_mass', label:'Lean Mass', unit:'lb', cat:'Body Composition', dir:'up-good', compareMode:'rolling7'},

  {id:'steps', label:'Steps', unit:'/day', cat:'Daily Activity', dir:'up-good', compareMode:'rolling7', roundInt:true, cumulative:true},
  {id:'distance', label:'Walk/Run Distance', unit:'mi', cat:'Daily Activity', dir:'up-good', compareMode:'rolling7', cumulative:true},
  {id:'active_energy', label:'Active Energy', unit:'kcal', cat:'Daily Activity', dir:'up-good', compareMode:'rolling7', cumulative:true},
  {id:'exercise_time', label:'Exercise Time', unit:'min', cat:'Daily Activity', dir:'up-good', compareMode:'rolling7', cumulative:true},
  {id:'flights', label:'Flights Climbed', unit:'', cat:'Daily Activity', dir:'up-good', compareMode:'rolling7', roundInt:true, cumulative:true},
  {id:'walking_speed', label:'Walking Speed', unit:'mph', cat:'Daily Activity', dir:'up-good', compareMode:'rolling7'},
  {id:'resting_hr', label:'Resting Heart Rate', unit:'bpm', cat:'Daily Activity', dir:'down-good', compareMode:'rolling7'},
  {id:'hrv', label:'HRV', unit:'ms', cat:'Daily Activity', dir:'up-good', compareMode:'rolling7'},
  {id:'alcohol', label:'Alcohol', unit:'drinks/day', cat:'Daily Activity', dir:'down-good', compareMode:'rolling7', cumulative:true},

  {id:'vo2max', label:'VO2 Max', unit:'ml/kg/min', cat:'Point-in-Time', dir:'up-good', compareMode:'latestVsPrevious'},
  {id:'cardio_recovery', label:'Cardio Recovery', unit:'bpm', cat:'Point-in-Time', dir:'up-good', compareMode:'latestVsPrevious'},
  {id:'six_min_walk', label:'6-Min Walk Test', unit:'m', cat:'Point-in-Time', dir:'up-good', compareMode:'latestVsPrevious'},
];

// The handful this person actually watches day to day — everything else lives under its category below.
const KEY_METRIC_IDS = ['weight', 'lean_mass', 'resting_hr', 'hrv', 'vo2max'];

let STORE = null;
let expandedId = null;

function fmtNum(n, roundInt){
  if(n === undefined || n === null || isNaN(n)) return '—';
  if (roundInt) return Math.round(n).toLocaleString();
  if(Math.abs(n) >= 10) return n.toFixed(1);
  return n.toFixed(2);
}
function fmtDate(d){
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-US', {month:'short', day:'numeric'});
}
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function shiftDate(dstr, days){
  const dt = new Date(dstr + 'T00:00:00');
  dt.setDate(dt.getDate() + days);
  return dt.toISOString().slice(0, 10);
}
function daysSince(d){
  const dt = new Date(d + 'T00:00:00');
  return Math.floor((Date.now() - dt.getTime()) / 86400000);
}
function avg(arr){ return arr.reduce((s,v) => s+v, 0) / arr.length; }

// 7-day average vs the prior 7-day average — smooths out single-day noise (important for HRV especially).
function rollingCompare(hist, windowDays){
  if (hist.length < 2) return null;
  const latestDate = hist[hist.length-1].date;
  const recentCutoff = shiftDate(latestDate, -(windowDays-1));
  const priorCutoff = shiftDate(latestDate, -(windowDays*2-1));
  const recent = hist.filter(h => h.date >= recentCutoff);
  const prior = hist.filter(h => h.date >= priorCutoff && h.date < recentCutoff);
  const minPts = Math.min(2, windowDays);
  if (recent.length < minPts || prior.length < minPts) return null;
  return { recentAvg: avg(recent.map(h=>h.value)), priorAvg: avg(prior.map(h=>h.value)), label: `${windowDays}d avg` };
}
function latestVsPrevious(hist){
  if (hist.length < 2) return null;
  return { recentAvg: hist[hist.length-1].value, priorAvg: hist[hist.length-2].value, label: 'vs previous reading' };
}
function comparisonFor(m, hist){
  if (m.compareMode === 'rolling7') return rollingCompare(hist, 7) || latestVsPrevious(hist);
  return latestVsPrevious(hist);
}
// Only 'up-good'/'down-good' get colored — everything else (or a ~zero delta) stays neutral grey.
function deltaClass(delta, dir){
  if (dir === 'neutral' || Math.abs(delta) < 1e-6) return 'flat';
  const improving = (dir === 'up-good' && delta > 0) || (dir === 'down-good' && delta < 0);
  return improving ? 'up' : 'down';
}

function sparkSVG(history, roundInt){
  const cutoff = history.length ? shiftDate(history[history.length-1].date, -27) : null;
  const windowed = cutoff ? history.filter(h => h.date >= cutoff) : history;
  if(windowed.length < 2){
    return { svg: `<svg class="spark" viewBox="0 0 56 24"><line x1="0" y1="12" x2="56" y2="12" stroke="#2A3238" stroke-width="1.5"/></svg>`, rangeLabel: null };
  }
  const vals = windowed.map(h => h.value);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max - min) || 1;
  const pts = vals.map((v,i) => {
    const x = (i/(vals.length-1)) * 54 + 1;
    const y = 22 - ((v-min)/range) * 20;
    return `${x},${y}`;
  }).join(' ');
  // Neutral color always — direction-aware color lives in the delta text below, not the sparkline.
  const svg = `<svg class="spark" viewBox="0 0 56 24"><polyline points="${pts}" fill="none" stroke="#4FD9AE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/></svg>`;
  // The line is auto-scaled to fill the box regardless of how big the swing actually is —
  // this label is what tells you whether that swing is 2 units or 20.
  const rangeLabel = min === max ? null : `${fmtNum(min, roundInt)}\u2013${fmtNum(max, roundInt)}`;
  return { svg, rangeLabel };
}

function bigChartSVG(hist, trainingDates){
  const W = 320, H = 110, PAD = 22;
  const vals = hist.map(pt => pt.value);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max - min) || 1;
  const coords = hist.map((pt, i) => ({
    x: PAD + (i / (hist.length - 1 || 1)) * (W - PAD*2),
    y: (H - PAD) - ((pt.value - min) / range) * (H - PAD*2),
    date: pt.date,
  }));
  const pointsStr = coords.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ');
  const markers = (trainingDates && trainingDates.size) ? coords.filter(c => trainingDates.has(c.date)) : [];
  return `
    <svg viewBox="0 0 ${W} ${H+16}" width="100%" height="${H+16}">
      <polyline points="${pointsStr}" fill="none" stroke="#4FD9AE" stroke-width="2"/>
      ${coords.map(c => `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="2.5" fill="#4FD9AE"/>`).join('')}
      ${markers.map(c => `<line x1="${c.x.toFixed(1)}" y1="${(H-PAD+4).toFixed(1)}" x2="${c.x.toFixed(1)}" y2="${(H+1).toFixed(1)}" stroke="#F2C94C" stroke-width="2" stroke-linecap="round"/>`).join('')}
      <text x="${PAD}" y="${H+14}" font-size="10" fill="#8CA39A">${fmtDate(hist[0].date)}</text>
      <text x="${W-PAD}" y="${H+14}" font-size="10" fill="#8CA39A" text-anchor="end">${fmtDate(hist[hist.length-1].date)}</text>
    </svg>
    ${markers.length ? `<div class="chart-legend"><span class="legend-tick"></span>training day logged</div>` : ''}`;
}

function detailPanel(m, hist, trainingDates){
  if (hist.length < 2) {
    return `<div class="detail-panel"><div class="detail-empty">Not enough history yet for a chart.</div></div>`;
  }
  const recent = hist.slice(-14).slice().reverse();
  const rows = recent.map(pt => {
    const trained = trainingDates && trainingDates.has(pt.date);
    return `<div class="detail-row"><span class="mono">${fmtDate(pt.date)}${trained ? ' 🏋️' : ''}</span><span class="mono">${fmtNum(pt.value, m.roundInt)}${m.unit}</span></div>`;
  }).join('');
  return `<div class="detail-panel">${bigChartSVG(hist, trainingDates)}<div class="detail-list">${rows}</div></div>`;
}

function metricRowHtml(m, store, trainingDates){
  const hist = (store[m.id] || []).slice().sort((a,b) => a.date.localeCompare(b.date));
  const latest = hist[hist.length-1];
  const comp = comparisonFor(m, hist);
  let deltaHTML = '';
  if (comp) {
    const d = comp.recentAvg - comp.priorAvg;
    const cls = deltaClass(d, m.dir);
    const sign = d > 0 ? '+' : '';
    deltaHTML = `<div class="delta ${cls}">${sign}${fmtNum(d, m.roundInt)} ${comp.label}</div>`;
  }
  const stale = latest && daysSince(latest.date) > 14 ? `<span class="stale-badge">STALE</span>` : '';
  const isPartial = m.cumulative && latest && latest.date === todayStr();
  const dateLabel = latest ? fmtDate(latest.date) + (isPartial ? ' · partial' : '') : '—';
  const spark = sparkSVG(hist, m.roundInt);
  const isOpen = expandedId === m.id;
  let html = `
    <div class="metric-row" data-id="${m.id}">
      <div class="info">
        <div class="label">${m.label}${stale}</div>
        <div class="date mono">${dateLabel}</div>
      </div>
      <div class="spark-wrap">${spark.svg}${spark.rangeLabel ? `<div class="spark-range mono">${spark.rangeLabel}</div>` : ''}</div>
      <div class="valwrap">
        <div class="val mono">${latest ? fmtNum(latest.value, m.roundInt) : '—'}<span class="unit">${m.unit}</span></div>
        ${deltaHTML}
      </div>
      <span class="chev">${isOpen ? '▲' : '▼'}</span>
    </div>`;
  if (isOpen) html += detailPanel(m, hist, trainingDates);
  return html;
}

function readinessSummary(store){
  const rhrHist = (store['resting_hr'] || []).slice().sort((a,b) => a.date.localeCompare(b.date));
  const hrvHist = (store['hrv'] || []).slice().sort((a,b) => a.date.localeCompare(b.date));
  const rhrComp = rollingCompare(rhrHist, 7);
  const hrvComp = rollingCompare(hrvHist, 7);
  if (!rhrComp && !hrvComp) return null; // not enough data yet to say anything responsible
  const flags = [];
  if (rhrComp && (rhrComp.recentAvg - rhrComp.priorAvg) >= 3) {
    flags.push(`resting HR is up ${fmtNum(rhrComp.recentAvg - rhrComp.priorAvg)} bpm vs your recent baseline`);
  }
  if (hrvComp && hrvComp.priorAvg > 0 && (hrvComp.priorAvg - hrvComp.recentAvg) / hrvComp.priorAvg >= 0.15) {
    flags.push(`HRV is down vs your recent baseline`);
  }
  if (!flags.length) return { icon: '✅', text: 'Resting HR and HRV look steady against your recent baseline — no readiness flags.' };
  return { icon: '⚠️', text: `${flags.join('; ')}. Might be worth an easier session — <a href="https://aaronlikeshoobs.github.io/workout-log/">check Training Log</a>.` };
}

let TRAINING_DATES = new Set();

// Only dates workout-log actually stamped via updatedAt count — no guessing at historical dates.
function buildTrainingDates(workoutData){
  const dates = new Set();
  Object.values(workoutData || {}).forEach((log) => {
    if (log && log.updatedAt) dates.add(log.updatedAt);
  });
  return dates;
}

function workoutIcon(name){
  const n = (name || '').toLowerCase();
  if (n.includes('hik')) return '🥾';
  if (n.includes('cyc') || n.includes('bik')) return '🚴';
  if (n.includes('strength') || n.includes('weight')) return '🏋️';
  if (n.includes('run')) return '🏃';
  if (n.includes('walk')) return '🚶';
  if (n.includes('yoga') || n.includes('mobility')) return '🧘';
  if (n.includes('swim')) return '🏊';
  return '⚡';
}

function workoutCardHtml(w){
  const stats = [];
  if (w.duration_min != null) stats.push(`${w.duration_min}min`);
  if (w.distance_mi != null) stats.push(`${w.distance_mi}mi`);
  if (w.calories != null) stats.push(`${w.calories}kcal`);
  if (w.avg_hr != null) stats.push(`avg ${w.avg_hr}bpm`);
  if (w.max_hr != null) stats.push(`max ${w.max_hr}bpm`);
  if (w.elevation_ft) stats.push(`+${w.elevation_ft}ft`);
  return `
    <div class="workout-card">
      <div class="workout-icon">${workoutIcon(w.name)}</div>
      <div class="workout-info">
        <div class="workout-name">${w.name || 'Workout'}</div>
        <div class="workout-date mono">${fmtDate(w.date)}</div>
        <div class="workout-stats mono">${stats.join(' &middot; ')}</div>
      </div>
    </div>`;
}

function render(store){
  STORE = store;
  const app = document.getElementById('app');
  const readiness = readinessSummary(store);
  let html = '';
  if (readiness) {
    html += `<div class="readiness"><span>${readiness.icon}</span><span>${readiness.text}</span></div>`;
  }

  const keyMetrics = KEY_METRIC_IDS.map(id => METRICS.find(m => m.id === id)).filter(Boolean);
  html += `<div class="category"><div class="category-head"><h2><span>🔑</span>Key Metrics</h2></div><div class="card">`;
  keyMetrics.forEach(m => { html += metricRowHtml(m, store, TRAINING_DATES); });
  html += `</div></div>`;

  const workouts = (store.workouts || []).slice().sort((a,b) => (b.start||'').localeCompare(a.start||'')).slice(0, 10);
  if (workouts.length) {
    html += `<div class="category"><div class="category-head"><h2><span>🏃</span>Workouts</h2><span class="count">${workouts.length}</span></div><div class="card workout-list">`;
    workouts.forEach(w => { html += workoutCardHtml(w); });
    html += `</div></div>`;
  }

  const categories = [...new Set(METRICS.map(m => m.cat))];
  categories.forEach(cat => {
    const metrics = METRICS.filter(m => m.cat === cat);
    html += `<div class="category"><div class="category-head"><h2><span>${CATEGORY_ICONS[cat] || ''}</span>${cat}</h2><span class="count">${metrics.length}</span></div><div class="card">`;
    metrics.forEach(m => { html += metricRowHtml(m, store, TRAINING_DATES); });
    html += `</div></div>`;
  });

  app.innerHTML = html;
}

document.getElementById('app').addEventListener('click', (e) => {
  const row = e.target.closest('.metric-row');
  if (!row || !STORE) return;
  const id = row.dataset.id;
  expandedId = expandedId === id ? null : id;
  render(STORE);
});

Promise.all([
  fetch('./data.json', {cache: 'no-store'}).then(r => {
    if(!r.ok) throw new Error('data.json not found');
    return r.json();
  }),
  // Same-origin GitHub Pages fetch — cross-app, non-critical: overlay just skips if this fails.
  fetch('https://aaronlikeshoobs.github.io/workout-log/data.json', {cache: 'no-store'})
    .then(r => r.ok ? r.json() : {})
    .catch(() => ({})),
])
  .then(([store, workoutData]) => {
    TRAINING_DATES = buildTrainingDates(workoutData);
    render(store);
    window.scrollTo(0, 0); // real content just rendered for the first time — reset scroll now, not before
  })
  .catch(err => {
    document.getElementById('app').innerHTML =
      `<div class="error">Couldn't load data.json — ${err.message}</div>`;
  });
</script>

</body>
</html>
